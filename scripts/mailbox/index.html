<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Harbor Mail</title><link rel="stylesheet" href="/mailbox.css"><script src="/mailbox.js" defer></script></head><body>
<header><a class="brand" href="/" aria-label="Harbor Mail home"><span class="brand-icon">✉</span>Harbor<span>Mail</span></a><div class="search-wrap"><input id="search" aria-label="Search this mailbox" placeholder="Search mail"></div><span class="local">LOCAL TEST MAIL</span><select id="account" aria-label="Choose mailbox"></select></header>
<div class="layout"><aside><button class="compose" id="compose">＋ <span>Compose</span></button><nav><button class="folder selected" data-folder="inbox">▣ <span>Inbox</span><b id="count"></b></button><button class="folder" data-folder="sent">↗ <span>Sent</span></button></nav><div class="aside-bottom"><div class="mini-avatar" id="avatar">A</div><strong id="account-name"></strong><small id="account-address"></small><p>Messages stay on this computer.</p></div></aside><main><div class="toolbar"><h1 id="heading">Inbox</h1><button id="refresh" class="quiet">↻ Refresh</button></div><div id="status" role="status" aria-live="polite"></div><div id="messages"></div><article id="reader" hidden></article></main></div>
<dialog id="composer"><form id="send-form"><div class="dialog-title"><strong>New message</strong><button type="button" id="close-compose" aria-label="Close new message">×</button></div><div class="compose-fields"><label>From <input id="from" readonly></label><label>To <input id="to" type="email" list="recipients" required placeholder="jordan@demo.test"></label><datalist id="recipients"></datalist><label>Subject <input id="subject" maxlength="150" required></label><textarea id="body" aria-label="Message body" maxlength="12000" required placeholder="Write your message…"></textarea><p id="send-error" role="alert"></p><div class="send-row"><button id="send" type="submit">Send ↗</button><small>Local @demo.test addresses only</small></div></div></form></dialog>
</body></html>
